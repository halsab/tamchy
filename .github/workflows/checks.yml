name: Проверки проекта

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Домен, браузерные адаптеры и React с покрытием
        run: npm run test:unit -- --coverage
      - name: Сборки и интеграция игровой сессии
        run: npm run test:integration
      - run: git diff --check
      - name: Подготовка графики и проверка каталога
        run: npm run validate:catalog
      - name: Техническая компиляция в корне
        run: npm run build:check
      - name: Техническая компиляция в подкаталоге
        run: npm run build:check
        env:
          VITE_BASE: /tamchy/
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Экраны и навигация в браузерах, обе базы
        run: npm run test:e2e
