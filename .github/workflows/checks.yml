name: Проверки проекта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.scope.outputs.kind }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Проверка workflow закреплённым actionlint
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - id: scope
        run: node scripts/ci-scope.ts
      - name: Явная отметка проверки без нового выпуска
        if: steps.scope.outputs.kind != 'app'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checks-only
          path: checks-only.json
          if-no-files-found: error
          retention-days: 30

  quick:
    needs: scope
    if: needs.scope.outputs.kind != 'app'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - if: needs.scope.outputs.kind == 'tooling'
        run: |
          npm run lint
          npm run typecheck
          npm run test:ci
      - run: git diff --check

  build:
    needs: scope
    if: needs.scope.outputs.kind == 'app'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - name: Кэш производных с проверкой исходников и SHA-256
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .cache/assets
            public/assets/images
            public/icons
          key: assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('assets-source/**/*.png', 'src/content/v2/graphics.json', 'scripts/prepare-assets.ts', 'scripts/lib/asset-cache.ts', 'scripts/lib/generated-files.ts', 'scripts/lib/neutral-png.ts', 'scripts/lib/resources.ts', 'src/services/assets/neutral-png.ts', 'package-lock.json', '.nvmrc') }}
          restore-keys: assets-${{ runner.os }}-${{ runner.arch }}-
      - name: Одна строгая сборка, бюджеты и сборки для обновлений
        run: npm run test:e2e:prepare
      - name: Домен, браузерные адаптеры и React с покрытием
        run: npm run test:unit -- --coverage
      - name: Сборки и интеграция игровой сессии
        run: npm run test:integration
      - run: git diff --check
      - name: Общий кандидат и план полной браузерной матрицы
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-inputs
          path: |
            .release/
            public/assets/images/
            public/icons/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Диагностика модульных проверок
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-reports
          path: coverage/
          retention-days: 30

  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    env:
      BROWSER: ${{ matrix.browser }}
      TAMCHY_SCREENSHOTS: reports/screenshots/${{ matrix.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: e2e-inputs
          path: .
      - run: npx playwright install --with-deps "$BROWSER"
      - name: Аудиовыход для браузера Linux
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tamchy
          pactl set-default-sink tamchy
      - name: Полный набор сценариев одного браузера без пересборки
        run: npm run test:e2e:browser -- "$BROWSER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: .release/results/${{ matrix.browser }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Исходные отчёты браузера, включая ошибки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-reports-${{ matrix.browser }}
          path: reports/
          retention-days: 30

  release:
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: e2e-inputs
          path: .
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: browser-evidence-*
          path: .release/results
          merge-multiple: true
      - name: Полнота матрицы и неизменность единого кандидата
        run: npm run test:e2e:finalize
      - run: npx playwright install --with-deps chromium
      - name: Аудиовыход для локальной проверки публикации
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tamchy
          pactl set-default-sink tamchy
      - name: Локальная проверка инструмента публикации для /tamchy/
        run: npm run check:published:local
      - name: Три холодных мобильных измерения /tamchy/
        run: npm run check:lighthouse
      - name: Явный выбор проверенного выпуска /tamchy/
        run: npm run release:verify
      - name: Отчёт с версией, коммитом и SHA-256 файлов
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: .release/subpath/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Упаковка только проверенного dist без пересборки
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .release/subpath/dist
          retention-days: 30
      - name: Неизменность после упаковки
        run: npm run release:verify
      - name: Отчёты выпуска, включая неуспешные измерения
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-reports
          path: |
            reports/
            .release/subpath/release.json
            .release/e2e-plan.json
            .release/results/
          include-hidden-files: true
          retention-days: 30

  check:
    needs: [scope, quick, build, browser, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SCOPE_RESULT: ${{ needs.scope.result }}
      KIND: ${{ needs.scope.outputs.kind }}
      QUICK_RESULT: ${{ needs.quick.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
    steps:
      - name: Обязательный итоговый статус
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$KIND" = app ]; then
            test "$BUILD_RESULT" = success
            test "$BROWSER_RESULT" = success
            test "$RELEASE_RESULT" = success
          else
            test "$QUICK_RESULT" = success
          fi
