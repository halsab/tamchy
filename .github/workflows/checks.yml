name: Проверки проекта

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TAMCHY_E2E_REPORTS: reports/e2e
      TAMCHY_SCREENSHOTS: reports/screenshots
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Подготовка графики и строгая проверка контента
        run: npm run validate:content
      - name: Домен, браузерные адаптеры и React с покрытием
        run: npm run test:unit -- --coverage
      - name: Сборки и интеграция игровой сессии
        run: npm run test:integration
      - run: git diff --check
      - name: Браузеры Playwright
        run: npx playwright install --with-deps chromium webkit firefox
      - name: Аудиовыход для браузеров Linux
        run: |
          sudo apt-get install --no-install-recommends -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=tamchy
          pactl set-default-sink tamchy
          pactl info
          pactl list short sinks
      - name: Сборка, ресурсы, бюджеты и PWA в браузерах для /tamchy/
        run: npm run test:e2e
      - name: Локальная проверка инструмента публикации для /tamchy/
        run: npm run check:published:local
      - name: Три холодных мобильных измерения /tamchy/
        run: npm run check:lighthouse
      - name: Явный выбор проверенного выпуска /tamchy/
        id: verified
        run: npm run release:verify
      - name: Отчёт с версией, коммитом и SHA-256 файлов
        id: release-report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: .release/subpath/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Упаковка только проверенного dist без пересборки
        id: pages-artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: .release/subpath/dist
          retention-days: 30
      - name: Неизменность после упаковки
        run: npm run release:verify
      - name: Диагностика и исходные отчёты, включая неуспешные проверки
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-reports
          path: |
            reports/
            coverage/
            .release/*/release.json
          include-hidden-files: true
          retention-days: 30
