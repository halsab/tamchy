name: Деплой без тестов

on:
  workflow_run:
    workflows: [Проверки проекта]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID успешного запуска проверок (пусто — последний успешный main)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Выбор уже проверенного артефакта
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          AUTOMATIC_DEPLOY: ${{ github.event_name == 'workflow_run' }}
        run: node scripts/select-deployment.ts
      - if: steps.source.outputs.deploy == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.runId }}
          artifact-ids: ${{ steps.source.outputs.pagesArtifactId }}
          path: transfer/pages
      - if: steps.source.outputs.deploy == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.runId }}
          artifact-ids: ${{ steps.source.outputs.reportArtifactId }}
          path: .release/subpath
      - if: steps.source.outputs.deploy == 'true'
        run: npm ci --ignore-scripts
      - name: Сверка целостности готового выпуска
        if: steps.source.outputs.deploy == 'true'
        id: verified
        env:
          TAMCHY_EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          mkdir -p .release/subpath/dist
          tar --no-same-owner --no-same-permissions -xf transfer/pages/artifact.tar -C .release/subpath/dist
          npm run release:verify
      - name: Передача исходного архива Pages без пересборки
        if: steps.source.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: transfer/pages/artifact.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Сохранение отчёта публикуемого выпуска
        if: steps.source.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: .release/subpath/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Публикация готового артефакта
        if: steps.source.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Адрес опубликованного выпуска
        if: steps.source.outputs.deploy == 'true'
        env:
          PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RELEASE: ${{ steps.verified.outputs.release }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.runId }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors "${PUBLISHED_URL}offline-manifest.json?release=${EXPECTED_RELEASE}" --output .release/published-manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, appendFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('.release/published-manifest.json', 'utf8'));
          assert.equal(manifest.release, process.env.EXPECTED_RELEASE, 'Pages пока отдаёт другой выпуск');
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `Опубликовано: ${process.env.PUBLISHED_URL}\n\nКоммит: ${process.env.SOURCE_COMMIT}\n\nИсходный запуск проверок: ${process.env.SOURCE_RUN_ID}\n\nВыпуск: ${manifest.release}\n`);
          NODE
